<header class="navbar">
  <nav class="container navbar__inner" aria-label="Ana menü">
    <a href="{% url 'poll_list' %}" class="logo"><span class="text-gradient">kararsızım</span> <span aria-hidden="true">🤔</span></a>
    <div class="navbar__actions">
      {% if user.is_authenticated %}
        <a href="{% url 'user_profile' user.username %}" class="navbar__user">@{{ user.username }}</a>
        <a href="{% url 'poll_create' %}" class="btn btn-primary btn-sm">Anket oluştur</a>
        <form method="post" action="{% url 'logout' %}" class="navbar__logout">
          {% csrf_token %}
          <button type="submit" class="btn btn-ghost btn-sm">Çıkış</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}" class="btn btn-ghost btn-sm">Giriş</a>
        <a href="{% url 'register' %}" class="btn btn-primary btn-sm">Kayıt ol</a>
      {% endif %}
    </div>
  </nav>
</header>
