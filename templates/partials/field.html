{# One form field: label, input, help text, inline errors. Usage: {% include "partials/field.html" with field=form.email %} #}
<div class="field{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.errors %}
    {% for error in field.errors %}<p class="field-error" id="{{ field.auto_id }}_error">{{ error }}</p>{% endfor %}
  {% elif field.help_text %}
    <p class="field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>
  {% endif %}
</div>
